{% extends "base.html" %}

{% block title %}
    Versenyzői belépés
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Versenyzői belépés</h1>
        <p>
            Jelentkezz be a kapott felhasználónévvel és jelszóval.
        </p>
    </div>
</div>

<section class="card login-card">
    <form
        method="post"
        action="{{ url_for('competitor.login') }}"
        class="admin-form"
    >
        <div class="form-group">
            <label for="username">
                Felhasználónév
            </label>

            <input
                id="username"
                name="username"
                type="text"
                maxlength="80"
                autocomplete="username"
                required
                autofocus
                value="{{ request.form.get('username', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="password">
                Jelszó
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="language">
                Nyelv / Language
            </label>

            {% set selected_language = request.form.get(
                'language',
                default_language
            ) %}

            <select
                id="language"
                name="language"
                required
            >
                <option
                    value="hu"
                    {% if selected_language == 'hu' %}
                        selected
                    {% endif %}
                >
                    Magyar
                </option>

                <option
                    value="en"
                    {% if selected_language == 'en' %}
                        selected
                    {% endif %}
                >
                    English
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button
                class="button"
                type="submit"
            >
                Belépés
            </button>
        </div>
    </form>
</section>
{% endblock %}
