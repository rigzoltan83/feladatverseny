{% extends "base.html" %}

{% block title %}
    {{ _("Versenyzői belépés") }}
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>
            {{ _("Versenyzői belépés") }}
        </h1>

        <p>
            {{
                _(
                    "Jelentkezz be a kapott "
                    "felhasználónévvel és jelszóval."
                )
            }}
        </p>
    </div>
</div>

<section class="card login-card">
    <form
        method="post"
        action="{{ url_for('competitor.login') }}"
        class="admin-form"
    >
        <div class="form-group">
            <label for="username">
                {{ _("Felhasználónév") }}
            </label>

            <input
                id="username"
                name="username"
                type="text"
                maxlength="80"
                autocomplete="username"
                required
                autofocus
                value="{{ request.form.get('username', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="password">
                {{ _("Jelszó") }}
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="language">
                {{ _("Nyelv") }}
            </label>

            <select
                id="language"
                onchange="
                    window.location.href =
                    this.value;
                "
            >
                <option
                    value="{{
                        url_for(
                            'competitor.set_language',
                            language='hu'
                        )
                    }}"
                    {% if get_locale()|string == 'hu' %}
                        selected
                    {% endif %}
                >
                    Magyar
                </option>

                <option
                    value="{{
                        url_for(
                            'competitor.set_language',
                            language='en'
                        )
                    }}"
                    {% if get_locale()|string == 'en' %}
                        selected
                    {% endif %}
                >
                    English
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button
                class="button"
                type="submit"
            >
                {{ _("Belépés") }}
            </button>
        </div>
    </form>
</section>
{% endblock %}
