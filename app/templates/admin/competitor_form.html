{% extends "base.html" %}

{% block title %}
    {{ _("Új versenyző") }}
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>{{ _("Új versenyző") }}</h1>

        <p>
            {{ _("Új versenyzői belépés létrehozása.") }}
        </p>
    </div>
</div>

<section class="card">
    <form
        method="post"
        action="{{ url_for('admin.competitor_create') }}"
        class="admin-form"
    >
        <div class="form-group">
            <label for="full_name">
                {{ _("Teljes név") }}
            </label>

            <input
                id="full_name"
                name="full_name"
                type="text"
                maxlength="200"
                required
                value="{{ request.form.get('full_name', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="username">
                {{ _("Felhasználónév") }}
            </label>

            <input
                id="username"
                name="username"
                type="text"
                maxlength="80"
                autocomplete="username"
                required
                value="{{ request.form.get('username', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="grade_id">
                {{ _("Évfolyam") }}
            </label>

            <select
                id="grade_id"
                name="grade_id"
                required
            >
                <option value="">
                    {{ _("Válassz évfolyamot") }}
                </option>

                {% for grade in grades %}
                    <option
                        value="{{ grade.id }}"
                        {% if
                            request.form.get(
                                'grade_id',
                                type=int
                            ) == grade.id
                        %}
                            selected
                        {% endif %}
                    >
                        {{
                            _(
                                "%(grade)s. évfolyam",
                                grade=grade.grade_number
                            )
                        }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="preferred_language">
                {{ _("Nyelv") }}
            </label>

            <select
                id="preferred_language"
                name="preferred_language"
                required
            >
                <option
                    value="hu"
                    {% if request.form.get(
                        'preferred_language',
                        'hu'
                    ) == 'hu' %}
                        selected
                    {% endif %}
                >
                    Magyar
                </option>

                <option
                    value="en"
                    {% if request.form.get(
                        'preferred_language'
                    ) == 'en' %}
                        selected
                    {% endif %}
                >
                    English
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">
                {{ _("Jelszó") }}
            </label>

            <input
                id="password"
                name="password"
                type="password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <small>
                {{ _("Legalább 6 karakter.") }}
            </small>
        </div>

        <div class="form-group">
            <label for="password_confirm">
                {{ _("Jelszó újra") }}
            </label>

            <input
                id="password_confirm"
                name="password_confirm"
                type="password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-actions">
            <button
                class="button"
                type="submit"
            >
                {{ _("Versenyző mentése") }}
            </button>

            <a
                class="button button-secondary"
                href="{{ url_for('admin.competitors') }}"
            >
                {{ _("Mégse") }}
            </a>
        </div>
    </form>
</section>
{% endblock %}
